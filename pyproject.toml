[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "sorethumb"
version = "0.1.0"
description = "Unsupervised anomaly detection for tabular data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tarne Westcott", email = "tarne.westcott@gmail.com" }]
keywords = [
    "anomaly-detection",
    "outlier-detection",
    "unsupervised-learning",
    "tabular-data",
    "machine-learning",
    "isolation-forest",
    "one-class-svm",
    "ensemble",
    "polars",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
# TreeSHAP/KernelSHAP explanations (explain/shap_tree.py, explain/gradient.py's
# kernel_shap_attributions). Without this extra, both gracefully fall back to
# the pure-numpy finite-difference gradient method with a FallbackAttributionWarning
# instead of raising -- see those modules' ImportError handling.
explain = [
    "shap>=0.45.0",
    # Pinned explicitly (not just a transitive shap dependency): an
    # unconstrained resolution has historically picked a numba version too
    # old to support the newer Python versions this project supports.
    "numba>=0.67.0",
]
# HTML report trend charts (report/charts.py). Not required for report
# rendering itself (report/html.py has no matplotlib dependency) -- only for
# render_trend_chart, which is not yet wired into the default report.
report = [
    "matplotlib>=3.8.0",
]
# The evaluation/benchmark harnesses (evaluate/benchmark.py's real-dataset
# suite, evaluate/pipeline_benchmark.py's sklearn-baseline comparison rows).
benchmark = [
    "datasets>=2.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.16.0",
    "mypy>=2.0.0",
    "pre-commit>=4.0.0",
    "pandas-stubs>=2.0.0",
]

[project.scripts]
sorethumb = "sorethumb.cli:app"

[project.urls]
Homepage = "https://github.com/tarne75/sorethumb"
Repository = "https://github.com/tarne75/sorethumb"
Documentation = "https://github.com/tarne75/sorethumb/blob/main/docs/index.md"
Changelog = "https://github.com/tarne75/sorethumb/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarne75/sorethumb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sorethumb"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # no-blank-line-before-class (conflicts with D211)
    "D212",    # multi-line-summary-first-line (conflicts with D213)
    "D213",    # multi-line-summary-second-line (conflicts with D212; allow either style)
    "COM812",  # trailing comma — conflicts with formatter
    "ISC001",  # implicit string concat — conflicts with formatter
    "ISC004",  # implicit string concat in collection — conflicts with formatter
    "E501",    # line length enforced by formatter
    "ANN401",  # typing.Any — intentional in some places
    "EM101",   # exception string literals
    "EM102",   # f-string in exception
    "TRY003",  # long exception messages
    "TRY300",  # else block after try/return — style preference
    "ERA001",  # commented-out code
    "T201",    # print — library has none; rich handles client output
    "PLR0913", # too many arguments
    "PLR0911", # too many return statements — classifiers naturally branch
    "PLR0912", # too many branches — classifiers naturally branch
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value comparison — many are well-understood constants (HTTP 400, 0.5, etc.)
    "FBT001",  # boolean positional args
    "FBT002",  # boolean default value
    "FBT003",  # boolean positional value in function call
    "CPY001",  # copyright notice — not required for this project
    "S101",    # assert — used for mypy type narrowing, not runtime validation
    "TC001",   # TYPE_CHECKING for app imports — optional, adds complexity
    "TC002",   # TYPE_CHECKING for third-party imports — optional
    "TC003",   # TYPE_CHECKING for stdlib imports — optional
    "SIM102",  # nested if statements — sometimes clearer than combined
    "PERF401", # list.extend vs list comprehension — style preference
    "RUF003",  # ambiguous dash character — false positive on docstrings
    "RUF002",  # ambiguous minus sign in docstrings — common in ML/sklearn convention
    "UP042",   # StrEnum — (str, Enum) is compatible with Python 3.11
    "N803",    # argument name X should be lowercase — sklearn convention for feature matrices
    "N806",    # variable X in function should be lowercase — sklearn convention for matrices
    "TC004",   # move import out of TYPE_CHECKING — used in __all__ at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["sorethumb"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S", "PLR", "PLC", "FBT", "F401", "DTZ", "F841", "N806", "SLF001", "ARG002", "RUF059"]
"docs/**" = ["INP001"]
# db.py builds IN-clause placeholders dynamically using '?' * len(list) — safe parameterised SQL
"src/sorethumb/store/db.py" = ["S608"]
# charts.py calls matplotlib.use("Agg") before pyplot import — canonical pattern; renaming to mpl is unconventional
"src/sorethumb/report/charts.py" = ["ICN001"]
# _pipeline.py: run_detection and _run_group are intentionally long orchestrators (82 and 72 stmts respectively)
"src/sorethumb/_pipeline.py" = ["PLR0915"]
# cli.py: _generate_starter_toml contains nested helpers that inflate the statement count
"src/sorethumb/cli.py" = ["PLR0915"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "shap.*",
    "joblib.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "numba.*",
    "datasets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sorethumb.scoring.combine",
    "sorethumb.scoring.calibrate",
    "sorethumb.features.reduce",
    "sorethumb.detectors.kmeans_distance",
]
warn_return_any = false


# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--durations=15",
    "-m",
    "not integration and not property and not benchmark and not slow and not network and not repo_check",
]
markers = [
    "unit: fast, deterministic, network-free tests with no real filesystem, SQLite, subprocess or model-serialisation I/O (the default lane)",
    "contract: tests that pin a public or persisted contract (public API surface, CLI exit codes/JSON, database schema, model manifests, FeaturePlan compatibility) without exercising a full workflow",
    "integration: tests that exercise a real workspace, SQLite store, CLI process, full pipeline run, model (de)serialisation, or report rendering",
    "property: Hypothesis-driven property tests",
    "slow: tests that are otherwise in-lane but too slow to run on every plain-pytest invocation (deselected by default)",
    "benchmark: opt-in accuracy measurement against real or synthetic datasets, including detector fitting (deselected by default)",
    "network: tests that require network access to fetch external datasets or resources (deselected by default)",
    "repo_check: tests that validate repository-level consistency (generated docs, README snippets, config schema) rather than library behaviour",
]
filterwarnings = [
    "error::sorethumb.errors.SorethumbWarning",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/sorethumb"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

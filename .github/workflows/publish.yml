name: Publish

# Publishes to PyPI via trusted publishing (OIDC — no API token stored).
# One-time setup on PyPI: add a trusted publisher for this project with
#   owner = tarne75, repository = sorethumb,
#   workflow = publish.yml, environment = pypi
# and create a `pypi` deployment environment in the repo settings.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to an exact commit (v10.1.0), not a floating major-version
      # tag, for reproducibility -- see P3-3 in prompts/pre-release-plan.md.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Verify tag, pyproject, wheel metadata, and imported runtime version all agree
        # P0-10: a mismatch anywhere in this chain means the thing about to be
        # published to PyPI is not the thing the tag, or a `pip install`, will
        # claim it is -- e.g. a stale pyproject.toml version, a build backend
        # not actually reading it, or sorethumb.__version__ drifting from the
        # installed distribution metadata (see src/sorethumb/__init__.py).
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          whl="$(ls dist/*.whl)"
          wheel_ver="$(unzip -p "$whl" '*.dist-info/METADATA' | grep -m1 '^Version:' | cut -d' ' -f2 | tr -d '\r')"
          python -m venv /tmp/verify-version-venv
          /tmp/verify-version-venv/bin/pip install --upgrade pip -q
          /tmp/verify-version-venv/bin/pip install "$whl" -q
          runtime_ver="$(/tmp/verify-version-venv/bin/python -c "import sorethumb; print(sorethumb.__version__)")"
          echo "tag=$tag  pyproject.version=$pkg  wheel_metadata_version=$wheel_ver  imported_runtime_version=$runtime_ver"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$wheel_ver" ] || [ "$tag" != "$runtime_ver" ]; then
            echo "::error::version mismatch -- tag=$tag pyproject=$pkg wheel=$wheel_ver runtime=$runtime_ver"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sorethumb
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

name: Publish

# Publishes to PyPI via trusted publishing (OIDC — no API token stored).
# One-time setup on PyPI: add a trusted publisher for this project with
#   owner = tarne75, repository = sorethumb,
#   workflow = publish.yml, environment = pypi
# and create a `pypi` deployment environment in the repo settings.
#
# P0-9: publication is gated on the exact tagged commit -- not main's latest,
# not a past ci.yml run -- passing the complete release-validation suite
# (release-validation.yml), and on that commit actually being reachable from
# the protected `main` branch (verify-tag-on-main). Every third-party action
# is pinned to an exact commit, not a floating tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  # Never cancel an in-flight publish -- a partially-cancelled PyPI upload is
  # worse than a queued duplicate. Re-pushing the same tag isn't a normal git
  # operation, so this group only ever matters for an accidental double-fire.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tagged commit ${{ github.sha }} is not reachable from origin/main -- refusing to publish a commit that never went through the protected branch."
            exit 1
          fi
          echo "OK: ${{ github.sha }} is reachable from origin/main."

  # Runs the exact same suite ci.yml runs on every push/PR, but against this
  # exact tagged commit -- not a past run on main, which could be stale (a
  # tag pushed some time after main last moved) or could have been for a
  # different commit than the one being tagged.
  validate:
    needs: verify-tag-on-main
    uses: ./.github/workflows/release-validation.yml

  verify-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sorethumb
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify tag, pyproject, wheel metadata, and imported runtime version all agree
        # The artifact downloaded here is the exact one release-validation.yml's
        # build job already built, twine-checked and smoke-tested against this
        # tagged commit -- this step never rebuilds it, only confirms its
        # version claims agree before it's published. A mismatch anywhere in
        # this chain means the thing about to reach PyPI is not the thing the
        # tag, or a `pip install`, will claim it is -- e.g. a stale
        # pyproject.toml version, or sorethumb.__version__ drifting from the
        # installed distribution metadata (see src/sorethumb/__init__.py).
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          whl="$(ls dist/*.whl)"
          wheel_ver="$(unzip -p "$whl" '*.dist-info/METADATA' | grep -m1 '^Version:' | cut -d' ' -f2 | tr -d '\r')"
          python -m venv /tmp/verify-version-venv
          /tmp/verify-version-venv/bin/pip install --upgrade pip -q
          /tmp/verify-version-venv/bin/pip install "$whl" -q
          runtime_ver="$(/tmp/verify-version-venv/bin/python -c "import sorethumb; print(sorethumb.__version__)")"
          echo "tag=$tag  pyproject.version=$pkg  wheel_metadata_version=$wheel_ver  imported_runtime_version=$runtime_ver"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$wheel_ver" ] || [ "$tag" != "$runtime_ver" ]; then
            echo "::error::version mismatch -- tag=$tag pyproject=$pkg wheel=$wheel_ver runtime=$runtime_ver"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

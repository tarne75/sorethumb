name: Release validation

# Reusable workflow: the one set of checks a commit must pass before
# it can be published. Called by ci.yml on every push/PR (so it's exercised
# continuously) and by publish.yml against the exact tagged commit (so
# publication is gated on that exact SHA passing, not on trusting a past
# ci.yml run against a possibly-different commit on main). Anything NOT
# required to gate a release -- the benchmark accuracy floors, informational
# coverage, the network-hitting docs-snippets/full-nightly lanes -- stays in
# ci.yml itself, not here. The one exception is `accuracy-smoke`: the
# fast, deterministic, network-free synthetic ROC-AUC floors, which every
# release commit must clear, so a score-direction or ranking regression can't
# be published even if the scheduled lanes haven't caught it yet.
#
# Every third-party action below is pinned to an exact commit, not a floating
# major-version tag -- see the header comment in ci.yml for why the SHA is
# repeated per step rather than centralised (`uses:` can't reference `env:`).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/
      - name: Verify configuration.md + prose docs match the schema
        run: uv run python docs/generate_config_docs.py --check

  # Fast unit tests + public/persistence contracts, across every supported
  # Python version (the deterministic compatibility suite), on every
  # supported OS. Steps run under bash everywhere (Git Bash on Windows) so the
  # same commands work on all three.
  fast-tests:
    name: fast-tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m "unit or contract" --junitxml=fast-tests.xml
      # Grouped failures as check-run annotations: readable through the checks
      # API (and on the run's summary page) without downloading the raw log.
      - name: Summarise failures
        if: failure()
        run: uv run --no-sync python scripts/summarise_junit.py --github-annotations --label "fast-tests ${{ matrix.os }} py${{ matrix.python }}" fast-tests.xml

  # Compatibility floor. Every other job here installs from the frozen
  # uv.lock, i.e. the *newest* versions that resolve -- so a declared lower bound
  # in pyproject.toml (`polars>=1.3.0`) is never actually exercised, and can be
  # wrong without anything failing. This job resolves each *direct* dependency
  # (core and every runtime extra) at exactly its declared minimum
  # (`--resolution lowest-direct`; transitive packages stay at their newest
  # compatible versions, as an end user's install would), on the minimum
  # supported Python, and runs the same unit + contract lanes as fast-tests.
  # Dev/test tooling (pytest, hypothesis, ...) is installed afterwards under the
  # runtime pins as a constraint file, so only the library's own floors are
  # under test. If this job fails, raise the floor in pyproject.toml (and
  # `uv lock`) -- do not weaken or skip the test.
  lowest-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - name: Resolve every direct runtime dependency at its declared minimum
        run: |
          uv pip compile pyproject.toml \
            --extra explain --extra benchmark \
            --resolution lowest-direct --python-version 3.11 \
            -o lowest-direct.txt
          grep -E '^(polars|pyarrow|numpy|scikit-learn|scipy|pydantic|pydantic-settings|typer|rich|httpx|joblib)==' lowest-direct.txt
      - name: Install the minimums, then the project and test tooling under them
        run: |
          uv venv --python 3.11 .lowest-venv
          uv pip install --python .lowest-venv/bin/python -r lowest-direct.txt
          uv pip install --python .lowest-venv/bin/python -c lowest-direct.txt -e ".[dev]"
      - name: Unit and contract lanes against the minimum versions
        run: .lowest-venv/bin/pytest -m "unit or contract"

  # Local integration tests (real workspace, SQLite, CLI process, full
  # pipeline, report rendering) on every supported OS: unit/contract coverage
  # alone can't show that file locking, atomic replacement, SQLite WAL,
  # console encoding and process behaviour work on a platform. Windows needs
  # the longer timeout (slower file I/O and process start-up).
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m integration --junitxml=integration.xml
      - name: Summarise failures
        if: failure()
        run: uv run --no-sync python scripts/summarise_junit.py --github-annotations --label "integration ${{ matrix.os }}" integration.xml

  # Bounded Hypothesis property tests.
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m property

  # Repository/docs consistency checks.
  repo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m repo_check

  # Ranking-quality gate. The existing fast synthetic accuracy smoke:
  # network-free (the two synthetic datasets only), seeded, ~4s of test time.
  # It asserts a tolerance-banded ROC-AUC floor per guarded detector (floors sit
  # below the observed values, so noise can't flake it) plus "default ensemble
  # beats random" -- the checks that catch an inverted score direction or a
  # detector that scores a planted anomaly cluster as normal. It runs here, not
  # only in ci.yml, so publish.yml / publish-testpypi.yml gate on it for the
  # exact commit being published. The expensive and network-backed suites
  # (full pipeline-scenario floors, real-dataset smoke) stay scheduled in
  # ci.yml's full-nightly.
  accuracy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/benchmark/test_accuracy_floors.py -m benchmark

  # Build, twine check, package-data assertion, and clean install smoke for
  # core and every advertised extra -- for BOTH the wheel and the sdist
  # (clean installs for core and each advertised extra). The sdist is also
  # covered, which was previously built and twine-checked but never
  # actually installed or inspected). Uploads the built dist/ as an artifact
  # so a caller (publish.yml) can publish the exact artifact that was just
  # validated here, rather than rebuilding a second time.
  build:
    runs-on: ubuntu-latest
    # Installing both the wheel and the sdist doubles the install-smoke-test matrix (wheel + sdist, each with
    # core + every extra) -- bumped from 15; pip's download cache is shared
    # across the venvs in this job, so the second (sdist) pass is markedly
    # faster than the first, not a full doubling.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Sync dev dependencies (for the dist-artifact pytest checks below)
        run: uv sync --all-extras --frozen
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Assert required paths, no unintended files, and matching metadata (wheel + sdist)
        # A wheel-only pipeline can't catch a broken OR over-inclusive sdist
        #: required-path presence (py.typed, SQL migrations, LICENSE,
        # README), rejection of repository-only material/dev-tool caches
        # (a past sdist here silently shipped .claude/ and .hypothesis/ --
        # see tests/repo_check/test_dist_artifacts.py's module docstring),
        # and wheel/sdist metadata agreement are all real, versioned test
        # assertions, not throwaway CI-only bash -- run them the same way
        # here as anyone can locally after `uv build`.
        run: uv run pytest tests/repo_check/test_dist_artifacts.py -v -m repo_check
      - name: Install each artifact (wheel, sdist) into clean venvs; smoke-test core + every advertised extra
        # Both artifacts get the exact same checks -- a wheel-only
        # install smoke test can't catch an sdist that's missing something
        # the wheel doesn't need directly (a build-time dependency, a
        # packaging config file) but a real end-user source install would.
        run: |
          set -e
          whl="$(ls dist/*.whl)"
          sdist="$(ls dist/*.tar.gz)"
          for artifact_name in wheel sdist; do
            if [ "$artifact_name" = "wheel" ]; then artifact="$whl"; else artifact="$sdist"; fi

            echo "::group::artifact=$artifact_name core"
            venv="/tmp/smoke-${artifact_name}-core"
            python -m venv "$venv"
            "$venv/bin/pip" install --upgrade pip
            "$venv/bin/pip" install "$artifact"
            "$venv/bin/sorethumb" --version
            "$venv/bin/python" -c "
          import sorethumb_ml
          from sorethumb_ml import Config, SourceConfig, run_detection
          # explain/benchmark modules must import fine with no optional
          # extra installed -- every shap/pandas/datasets import in
          # them is lazy (function-level), not at module load time.
          import sorethumb_ml.explain.shap_tree
          import sorethumb_ml.explain.gradient
          print('import OK ($artifact_name)', sorethumb_ml.__version__)
          "
            echo "::endgroup::"

            for extra in explain benchmark dev; do
              case "$extra" in
                explain)   smoke_import="import shap, numba" ;;
                benchmark) smoke_import="import datasets, pandas" ;;
                dev)       smoke_import="import pytest, hypothesis, ruff, mypy" ;;
              esac
              echo "::group::artifact=$artifact_name extra=$extra"
              venv="/tmp/smoke-${artifact_name}-${extra}"
              python -m venv "$venv"
              "$venv/bin/pip" install --upgrade pip
              "$venv/bin/pip" install "${artifact}[${extra}]"
              "$venv/bin/python" -c "
          import sorethumb_ml
          ${smoke_import}  # noqa: F401
          print('import OK ($artifact_name, $extra)', sorethumb_ml.__version__)
          "
              echo "::endgroup::"
            done
          done
      - name: Run the published quickstart snippet against the clean, extras-free wheel install
        # The README's flagship snippet must actually work end-to-end against
        # exactly what `pip install sorethumb-ml` gives a user -- no extras,
        # no editable/source checkout. Extracted from README.md at run time
        # (never copy-pasted here) so this can never silently drift from
        # what's actually published; reuses the wheel/core venv the loop
        # above already created rather than standing up a new one.
        run: |
          python3 docs/check_readme_snippets.py --extract-python /tmp/quickstart_snippet.py
          /tmp/smoke-wheel-core/bin/python /tmp/quickstart_snippet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  # The exact built wheel, installed the way a Windows user would: pip in a
  # fresh venv, from PowerShell (deliberately not bash), on the oldest and
  # newest supported Python, then the console script and the README
  # quickstart; plus the [explain] extra. The build job above only installs on
  # Ubuntu, so this is the one place the Windows console-script entry point
  # (sorethumb.exe) is exercised from a real install rather than a checkout.
  windows-install-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            extra: ""
          - python: "3.13"
            extra: ""
          - python: "3.12"
            extra: "[explain]"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean venv
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv "$env:RUNNER_TEMP\smoke"
          $wheel = (Get-ChildItem dist\*.whl).FullName
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -m pip install "$wheel${{ matrix.extra }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Console script
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:RUNNER_TEMP\smoke\Scripts\sorethumb.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\smoke\Scripts\sorethumb.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: README quickstart against the installed wheel
        run: |
          $ErrorActionPreference = "Stop"
          python docs/check_readme_snippets.py --extract-python "$env:RUNNER_TEMP\quickstart.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" "$env:RUNNER_TEMP\quickstart.py"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: Zero-config CLI run with stdin from NUL
        run: |
          $ErrorActionPreference = "Stop"
          $work = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\zero-config" -Force
          Push-Location $work
          & "$env:RUNNER_TEMP\smoke\Scripts\python.exe" -c "import numpy as np, polars as pl; rng = np.random.default_rng(0); a = rng.normal(50, 10, 500); a[:5] = 900; pl.DataFrame({'amount': a, 'region': rng.choice(['us', 'eu'], 500), 'temp': rng.normal(20, 3, 500)}).write_csv('data.csv')"
          cmd /c "$env:RUNNER_TEMP\smoke\Scripts\sorethumb.exe run data.csv < NUL > run.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content run.txt
          if ($code -ne 0) { exit $code }
          & "$env:RUNNER_TEMP\smoke\Scripts\sorethumb.exe" anomalies --top 5 | Out-File anomalies.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content anomalies.txt
          Pop-Location

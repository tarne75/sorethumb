name: Publish (TestPyPI rehearsal)
# Rehearses publish.yml against TestPyPI: the same validation suite, build-once
# artifact hand-off, version check and pinned upload action, with only the index
# and secret swapped. Manual only. It publishes a pre-release of pyproject.toml's
# version (inputs.version, e.g. 0.1.0rc1): TestPyPI files are immutable, so each
# attempt needs a new one. Setup and verification: docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release to publish, new for each attempt (e.g. 0.1.0rc1)
        required: true
        type: string

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fails in seconds on a bad version, before the full validation suite.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - env:
          VERSION: ${{ inputs.version }}
        run: python scripts/rehearsal_version.py "$VERSION"

  validate:
    needs: check-version
    uses: ./.github/workflows/release-validation.yml
    with:
      version: ${{ inputs.version }}

  verify-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sorethumb-ml
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set the rehearsal version
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/rehearsal_version.py "$VERSION" --apply
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify pyproject, wheel metadata, and imported runtime version all agree
        # No tag to check (unlike publish.yml): pyproject.toml now holds the
        # rehearsal version, and the wheel and its installed runtime must agree.
        run: |
          set -e
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          whl="$(ls dist/*.whl)"
          wheel_ver="$(unzip -p "$whl" '*.dist-info/METADATA' | grep -m1 '^Version:' | cut -d' ' -f2 | tr -d '\r')"
          python -m venv /tmp/verify-version-venv
          /tmp/verify-version-venv/bin/pip install --upgrade pip -q
          /tmp/verify-version-venv/bin/pip install "$whl" -q
          runtime_ver="$(/tmp/verify-version-venv/bin/python -c "import sorethumb_ml; print(sorethumb_ml.__version__)")"
          echo "pyproject.version=$pkg  wheel_metadata_version=$wheel_ver  imported_runtime_version=$runtime_ver"
          if [ "$pkg" != "$wheel_ver" ] || [ "$pkg" != "$runtime_ver" ]; then
            echo "::error::version mismatch -- pyproject=$pkg wheel=$wheel_ver runtime=$runtime_ver"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

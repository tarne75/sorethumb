name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly accuracy-regression run (Mondays 06:00 UTC). Only this event
    # triggers the `benchmark` job below.
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/
      - name: Verify docs/configuration.md is up to date
        run: uv run python docs/generate_config_docs.py --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: Install shap (Python 3.12 workaround — uv pulls incompatible numba)
        run: uv pip install "shap>=0.45"
      - run: |
          uv run pytest \
            -m "not integration and not benchmark" \
            --cov=sorethumb \
            --cov-report=xml \
            --cov-fail-under=80
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Assert package data is shipped in the wheel
        run: |
          unzip -l dist/*.whl | grep -q 'sorethumb/py.typed'
          unzip -l dist/*.whl | grep -q 'sorethumb/store/migrations/001_initial.sql'
      - name: Install the wheel into a clean venv and smoke-test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/sorethumb --version
          /tmp/smoke/bin/python -c "import sorethumb; from sorethumb import Config, SourceConfig, run_detection; print('import OK', sorethumb.__version__)"

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv pip install "shap>=0.45"
      - run: uv run pytest -m benchmark --tb=short

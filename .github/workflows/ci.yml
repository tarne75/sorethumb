name: CI

on:
  push:
    # windows-support: temporary, so the Windows work-in-progress branch gets CI
    # on every push (there is no PR for it yet). Remove before merging to main.
    branches: [main, windows-support]
  pull_request:
  schedule:
    # Weekly full-accuracy/slow/network + nightly-profile property run
    # (Mondays 06:00 UTC). Only this event (or a manual dispatch) triggers
    # the schedule-only jobs below.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Every astral-sh/setup-uv@<sha> reference below is pinned to an exact commit
# (bec219d24cd3e171d82865faccec33120bb574f4 == the v10.1.0 tag), not a
# floating major-version tag, for reproducibility. `uses:` can't reference `env:`/expressions, so
# the SHA is repeated per job rather than centralised. Every other
# third-party action is pinned to an exact commit the same way.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required release-gating suite (ruff/format/mypy, repo-check, fast
  # tests across Python versions, integration, property, build+twine+smoke)
  # lives in release-validation.yml so publish.yml can run the exact same
  # checks against the exact tagged commit, not just trust this run.
  validate:
    uses: ./.github/workflows/release-validation.yml

  # Required PR lane: one tolerance-banded benchmark smoke case that catches
  # a score-direction regression. Deliberately narrow (synthetic data only,
  # one seed) so it stays fast enough to require on every PR; the full
  # accuracy-floor suite and real-dataset checks run on schedule (see
  # `full-nightly` below). The same test also runs inside
  # release-validation.yml's `accuracy-smoke` job, which is what gates
  # publication of the exact tagged commit; this standalone job is kept so the
  # existing required-check name keeps resolving. Once branch protection is
  # pointed at `validate / accuracy-smoke`, this duplicate can be removed.
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest tests/benchmark/test_accuracy_floors.py -m benchmark

  # Informational overall branch coverage + required >=85% diff coverage on
  # changed lines. Replaces the old global --cov-fail-under merge gate,
  # which incentivised padding (assertion-free importlib.reload tests) more
  # than it caught real regressions — see tests/README.md.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - name: Run behavioural lanes with branch coverage (informational)
        run: |
          uv run pytest \
            -m "unit or contract or integration or property or repo_check" \
            --cov=sorethumb_ml \
            --cov-report=xml \
            --cov-report=term
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
      - name: Diff coverage on changed lines (required, >=85%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          uvx diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85

  # Required PR lane: executes every fenced code block in README.md against
  # the editable source checkout (bash commands checked against the live CLI,
  # toml fragments against the Config schema, the Python quickstart actually
  # run). No longer network-gated: the quickstart used to download the
  # KDDCup99 10% subset via scikit-learn; it now generates its own small
  # synthetic dataset in-process, so this can run on every push instead of
  # schedule/workflow_dispatch only. release-validation.yml's build job runs
  # the same quickstart block again, separately, against a clean, extras-free
  # wheel install -- this job alone can't stand in for that, since it runs
  # against the dev environment, not an installed distribution.
  docs-snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run python docs/check_readme_snippets.py

  # Full accuracy/slow/network suite plus a larger Hypothesis profile, on a
  # frozen canonical environment (ubuntu-latest, pinned Python), manual or
  # nightly only — never required on a PR.
  full-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      HYPOTHESIS_PROFILE: nightly
      # The real-dataset benchmark skips when it cannot fetch data; here the
      # network is expected, so an unreachable dataset must fail the job.
      SORETHUMB_REQUIRE_NETWORK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m "benchmark or slow or network or property" --tb=short

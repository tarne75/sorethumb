# Pre-registered 2026-10-14, after the round-2 development run and before any round-2 confirmation run.
candidate = "rule:discrete-budget@1"
baseline = "intersection@1"
confirmation_round = 2
hypothesis = """
discrete-composite-v1 improved flag F1 on all-categorical data but ranked worse than the
default (AP 0.149 vs 0.169): the gain came from where the flag threshold sits, not from the
composite's ranking. This rule keeps the default's ranking (intersection@1's combined score
over every detector) and on all-discrete data flags exactly the review budget's top rows by
it. Hypothesis: flag F1 on all_categorical improves over the default with average precision
unchanged; every other scenario runs the default unchanged.
"""
primary_metric = "flag_f1"
scenarios = ["all_categorical"]
require = "all"
alpha = 0.05
stability_metric = "flag_jaccard_stability"
stability_tolerance = 0.05
n_resamples = 10000
expected_outcome = """
Outperforms. On the development seeds flag F1 on all_categorical improved by +0.17 (95% CI
+0.11 to +0.22, Holm p 0.0002) with no budget or stability regression; average precision is
the default's by construction, and every other scenario is identical to the default.
"""

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160">

  <!-- Background -->
  <rect width="860" height="160" fill="#123A66"/>

  <!-- Ghost bar decoration (bottom-right corner, echoes the logo mark) -->
  <rect x="780" y="128" width="20" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="810" y="96"  width="20" height="64" rx="4" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="840" y="128" width="20" height="32" rx="4" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Blue accent line at bottom edge -->
  <rect x="0" y="157" width="860" height="3" fill="#2F80ED"/>

  <!-- Logo mark (80×80) -->
  <rect x="32" y="40" width="80" height="80" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <!-- Left bar -->
  <rect x="47" y="85" width="12" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.30"/>
  <!-- Middle bar — the anomaly -->
  <rect x="66" y="65" width="12" height="40" rx="3" fill="#2F80ED"/>
  <!-- Right bar -->
  <rect x="85" y="85" width="12" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.30"/>

  <!-- Wordmark -->
  <text
    x="140" y="82"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="44" font-weight="800" letter-spacing="-1"
    fill="#FFFFFF">sorethumb</text>

  <!-- Tagline -->
  <text
    x="141" y="110"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="15" font-weight="400"
    fill="#9FBBDF">unsupervised anomaly detection for tabular data</text>

</svg>
